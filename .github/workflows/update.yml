name: 番号データの更新

on:
  schedule:
    # 毎月3日 午前4時（日本時間）。総務省の更新は月初が多いため
    - cron: "0 19 2 * *"
  workflow_dispatch: # 手動でも実行できる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要な部品を入れる
        run: pip install pandas openpyxl xlrd pdfplumber requests beautifulsoup4

      - name: 総務省のデータを取得して変換する
        run: python tools/build_numbers.py --out numbers.tsv

      - name: 変わっていれば保存する
        run: |
          if git diff --quiet -- numbers.tsv && git ls-files --error-unmatch numbers.tsv >/dev/null 2>&1; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add numbers.tsv
          git commit -m "番号データを更新"
          git push
